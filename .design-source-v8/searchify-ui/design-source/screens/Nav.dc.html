<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Searchify — Side menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="flex: 1; align-self: stretch; width: 100%; min-height: 960px; box-sizing: border-box; padding: 22px 14px; background: #0D0E10; border-right: 1px solid #1A1D22; font-family: Geist, 'Helvetica Neue', sans-serif; color: #F2F4F5; display: flex; flex-direction: column; gap: 22px">
  <a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none; color: #F2F4F5">
    <svg width="30" height="30" viewBox="0 0 32 32" role="img" aria-label="Searchify"><rect x="0.5" y="0.5" width="31" height="31" rx="8.5" fill="#131519" stroke="#2E333B"></rect><circle cx="9" cy="12.5" r="2.9" fill="#FF5A4E"></circle><circle cx="16" cy="12.5" r="2.9" fill="#FF9F43"></circle><circle cx="23" cy="12.5" r="2.9" fill="#FFC53D"></circle><circle cx="9" cy="19.5" r="2.9" fill="#3DDC84"></circle><circle cx="16" cy="19.5" r="2.9" fill="#2CC7C0"></circle><circle cx="23" cy="19.5" r="2.9" fill="#4DA3FF"></circle></svg>
    <span style="font-family: 'Bricolage Grotesque', Geist, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.4px">searchify</span>
  </a>

  <a href="Portfolio.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 6px 12px; border-radius: 12px; border: 1px solid #262A31; background: #131519; color: #F2F4F5; text-decoration: none">
    <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 12px; color: #9AA1AB">Working on</span><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">northline.example</span></span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA1AB" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; color: #7D848E">Core features</span>
    <sc-for list="{{core}}" as="it" hint-placeholder-count="8">
      <sc-if value="{{it.on}}" hint-placeholder-val="{{false}}">
        <a href="{{it.href}}" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 11px; background: #131519; box-shadow: inset 3px 0 0 #4DA3FF; color: #F2F4F5; text-decoration: none; font-size: 14px; font-weight: 600">
          <span style="width: 22px; height: 22px; flex: none; border-radius: 50%; background: #4DA3FF; color: #0A0B0D; display: grid; place-items: center; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; box-shadow: 0 0 10px rgba(77,163,255,.6)">{{it.n}}</span>{{it.label}}
        </a>
      </sc-if>
      <sc-if value="{{it.off}}" hint-placeholder-val="{{true}}">
        <a href="{{it.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 11px; color: #B4BAC3; text-decoration: none; font-size: 14px">
          <span style="width: 22px; height: 22px; flex: none; border-radius: 50%; border: 1px solid #3A404A; box-sizing: border-box; display: grid; place-items: center; font-family: 'Geist Mono', monospace; font-size: 11px; color: #9AA1AB">{{it.n}}</span>{{it.label}}
        </a>
      </sc-if>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; color: #7D848E">Profile and sites</span>
    <sc-for list="{{account}}" as="it" hint-placeholder-count="5">
      <sc-if value="{{it.on}}" hint-placeholder-val="{{false}}">
        <a href="{{it.href}}" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 11px; background: #131519; box-shadow: inset 3px 0 0 #4DA3FF; color: #F2F4F5; text-decoration: none; font-size: 14px; font-weight: 600">{{it.label}}</a>
      </sc-if>
      <sc-if value="{{it.off}}" hint-placeholder-val="{{true}}">
        <a href="{{it.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 11px; color: #B4BAC3; text-decoration: none; font-size: 14px">{{it.label}}</a>
      </sc-if>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; border: 1px solid #1A1D22; color: #F2F4F5; text-decoration: none">
    <span style="width: 34px; height: 34px; flex: none; border-radius: 50%; background: #262A31; display: grid; place-items: center; font-size: 12px; font-weight: 600">AR</span>
    <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 500">Alex Rivera</span><span style="font-size: 12px; color: #9AA1AB">Rivera Digital · Premium</span></span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["connect","scan","home","path","tracker","backlinks","results","reports","command","sites","clientreport","settings","billing"],"default":"home"},"$preview":{"width":248,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 'home';
    const core = [
      ['connect', 'Plug in', 'Connect.dc.html'],
      ['scan', 'Site scan', 'Scan.dc.html'],
      ['home', 'Today’s moves', 'Home.dc.html'],
      ['path', 'Page progress', 'Path.dc.html'],
      ['tracker', 'Keyword tracker', 'Win.dc.html'],
      ['backlinks', 'Backlinks', 'Backlinks.dc.html'],
      ['results', 'Results', 'Results.dc.html'],
      ['reports', 'Reports and change log', 'Changelog.dc.html']
    ].map((d, i) => ({ n: String(i + 1), label: d[1], href: d[2], on: d[0] === cur, off: d[0] !== cur }));
    const account = [
      ['command', 'Agency command centre', 'Command.dc.html'],
      ['sites', 'All client sites', 'Portfolio.dc.html'],
      ['clientreport', 'Client report', 'Report.dc.html'],
      ['settings', 'Settings', 'Settings.dc.html'],
      ['billing', 'Plan and billing', 'Pricing.dc.html']
    ].map((d) => ({ label: d[1], href: d[2], on: d[0] === cur, off: d[0] !== cur }));
    return { core: core, account: account };
  }
}
</script>
</body>
</html>
