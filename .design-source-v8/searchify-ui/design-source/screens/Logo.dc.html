    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; font-size: 12px; color: #9AA1AB">

      <span style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: #7D848E">
        <svg width="64" height="64" viewBox="0 0 32 32" aria-hidden="true"><rect x="0.5" y="0.5" width="31" height="31" rx="8.5" fill="#131519" stroke="#2E333B"></rect><circle cx="9" cy="12.5" r="2.9" fill="#FF5A4E"></circle><circle cx="16" cy="12.5" r="2.9" fill="#FF9F43"></circle><circle cx="23" cy="12.5" r="2.9" fill="#FFC53D"></circle><circle cx="9" cy="19.5" r="2.9" fill="#3DDC84"></circle><circle cx="16" cy="19.5" r="2.9" fill="#2CC7C0"></circle><circle cx="23" cy="19.5" r="2.9" fill="#4DA3FF"></circle></svg>64</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: #7D848E">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="0.5" y="0.5" width="31" height="31" rx="8.5" fill="#131519" stroke="#2E333B"></rect><circle cx="9" cy="12.5" r="2.9" fill="#FF5A4E"></circle><circle cx="16" cy="12.5" r="2.9" fill="#FF9F43"></circle><circle cx="23" cy="12.5" r="2.9" fill="#FFC53D"></circle><circle cx="9" cy="19.5" r="2.9" fill="#3DDC84"></circle><circle cx="16" cy="19.5" r="2.9" fill="#2CC7C0"></circle><circle cx="23" cy="19.5" r="2.9" fill="#4DA3FF"></circle></svg>32</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: #7D848E">
        <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><rect x="0" y="0" width="32" height="32" rx="8" fill="#131519"></rect><circle cx="9" cy="12.5" r="3.3" fill="#FF5A4E"></circle><circle cx="16" cy="12.5" r="3.3" fill="#FF9F43"></circle><circle cx="23" cy="12.5" r="3.3" fill="#FFC53D"></circle><circle cx="9" cy="19.5" r="3.3" fill="#3DDC84"></circle><circle cx="16" cy="19.5" r="3.3" fill="#2CC7C0"></circle><circle cx="23" cy="19.5" r="3.3" fill="#4DA3FF"></circle></svg>16</span>
      <span style="flex: 1"></span>
      <span style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: #F2F4F5; color: #0A0B0D">
        <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect x="0.5" y="0.5" width="31" height="31" rx="8.5" fill="#131519"></rect><circle cx="9" cy="12.5" r="2.9" fill="#FF5A4E"></circle><circle cx="16" cy="12.5" r="2.9" fill="#FF9F43"></circle><circle cx="23" cy="12.5" r="2.9" fill="#FFC53D"></circle><circle cx="9" cy="19.5" r="2.9" fill="#3DDC84"></circle><circle cx="16" cy="19.5" r="2.9" fill="#2CC7C0"></circle><circle cx="23" cy="19.5" r="2.9" fill="#4DA3FF"></circle></svg>
        <span style="font-family: 'Bricolage Grotesque', Geist, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.6px">searchify</span>
      </span>
